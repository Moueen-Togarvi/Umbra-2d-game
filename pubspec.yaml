name: umbra
description: A Limbo-inspired atmospheric 2D platformer built with Flutter and Flame.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Flame is the game loop, component tree and rendering layer.
  flame: ^1.38.0

  # flame_forge2d bridges Flame to Forge2D, which as of 0.20.0 is a binding for
  # Box2D v3 (native FFI on desktop/mobile, WebAssembly on web). This is a full
  # rewrite of the old pure-Dart Box2D 2.x port: FixtureDef and PolygonShape no
  # longer exist. See STEP1_NOTES.md for the API differences that matter.
  flame_forge2d: ^0.20.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Only the film grain is a bitmap: the boy, the ground and the fogged
  # forest are all drawn procedurally. The older painted backgrounds and
  # props under assets/images/ stay in the repo but are not bundled.
  assets:
    - assets/images/grain.png
    - assets/images/part1/
    - assets/images/part2/
    - assets/brand/

  fonts:
    # Cinzel, by Natanael Gama, SIL Open Font License 1.1
    # (assets/fonts/Cinzel-OFL.txt). The brand's only typeface.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
