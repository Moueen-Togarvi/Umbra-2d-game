name: umbra
description: A Limbo-inspired atmospheric 2D platformer built with Flutter and Flame.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # Flame is the game loop, component tree and rendering layer.
  flame: ^1.38.0

  # flame_forge2d bridges Flame to Forge2D, which as of 0.20.0 is a binding for
  # Box2D v3 (native FFI on desktop/mobile, WebAssembly on web). This is a full
  # rewrite of the old pure-Dart Box2D 2.x port: FixtureDef and PolygonShape no
  # longer exist. See STEP1_NOTES.md for the API differences that matter.
  flame_forge2d: ^0.20.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Original procedural characters, existing painted scenery, and synthesized audio.
  assets:
    - assets/images/grain.png
    - assets/images/part1/
    - assets/images/part2/
    - assets/images/part3/
    - assets/images/part4/
    - assets/images/backgrounds/
    - assets/images/characters/
    - assets/images/ui/
    - assets/images/white_trees/
    - assets/brand/
    - assets/audio/sfx/
    - assets/audio/loops/
    - assets/audio/music/

  fonts:
    # Cinzel, by Natanael Gama, SIL Open Font License 1.1
    # (assets/fonts/Cinzel-OFL.txt). The brand's typeface: the wordmark,
    # headings and numerals.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
    # Cormorant Garamond Italic, by Christian Thalmann, SIL Open Font
    # License 1.1 (assets/fonts/CormorantGaramond-OFL.txt). The main menu's
    # choices.
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
